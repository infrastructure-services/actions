name: Repository Discovery V2 TEST (Read Only)
description: Observa proyectos, migrations, snapshots y lineage EF en TEST sin modificar el repository

inputs:
  environment-name:
    description: Ambiente autorizado; debe ser exactamente TEST.
    required: true
  inspection-status:
    description: READY, UNKNOWN o NOT_ATTEMPTED explícito.
    required: true
  workspace:
    description: Directorio dentro de GITHUB_WORKSPACE; requerido sólo para READY.
    required: false
  ef-source-json:
    description: Declaración efSource gobernada; opcional y válida sólo junto con actual-source-revision.
    required: false
  actual-source-revision:
    description: SHA Git completa del source tree ya disponible; no realiza checkout.
    required: false

  caller-source-json:
    description: Identidad y SHA efectivos del caller; separados de la provenance historica de adopcion.
    required: false

outputs:
  status:
    value: ${{ steps.discover.outputs.status }}
  evidence-json:
    description: Fuente repository V2 estructurada y sanitizada.
    value: ${{ steps.discover.outputs.evidence-json }}
  migration-ids-json:
    description: MigrationId exactos y ordenados; [] cuando no corresponda.
    value: ${{ steps.discover.outputs.migration-ids-json }}
  raw-evidence-json:
    description: Evidencia raw auditable; se publica cuando efSource está presente.
    value: ${{ steps.discover.outputs.raw-evidence-json }}
  managed-evidence-json:
    description: Resultado de validación y proyección managed; se publica cuando efSource está presente.
    value: ${{ steps.discover.outputs.managed-evidence-json }}

runs:
  using: composite
  steps:
    - name: Discover repository evidence in TEST (read only)
      id: discover
      shell: bash
      env:
        ENVIRONMENT_NAME: ${{ inputs.environment-name }}
        INSPECTION_STATUS: ${{ inputs.inspection-status }}
        WORKSPACE: ${{ inputs.workspace }}
        EF_SOURCE_JSON: ${{ inputs.ef-source-json }}
        ACTUAL_SOURCE_REVISION: ${{ inputs.actual-source-revision }}
        CALLER_SOURCE_JSON: ${{ inputs.caller-source-json }}
      run: node "$GITHUB_ACTION_PATH/../scripts/run-repository-discovery-v2-public.mjs"
