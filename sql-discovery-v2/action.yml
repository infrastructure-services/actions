name: SQL Discovery V2 TEST (Read Only)
description: Observa conectividad, existencia, metadata, estado físico e historial EF en TEST sin mutaciones

inputs:
  environment-name:
    description: Ambiente autorizado; debe ser exactamente TEST.
    required: true
  server-connection-string:
    description: Connection string al servidor; sólo se entrega al proceso por ambiente y nunca se persiste.
    required: true
  database-name:
    description: Nombre explícito de la base target observada.
    required: true
  tls-mode:
    description: Política TLS explícita. STRICT por defecto; TEST_UNTRUSTED_CERTIFICATE sólo se permite en TEST.
    required: false
    default: STRICT
  dotnet-version:
    description: Versión del SDK para la implementación existente.
    required: false
    default: 10.0.x

outputs:
  failure-evidence-json:
    description: Envelope terminal sanitizado; sólo se publica para fallos CLI reconocidos y validados.
    value: ${{ steps.discover.outputs.failure-evidence-json }}
  execution-exit-code:
    description: Exit code preservado del CLI para un fallo reconocido.
    value: ${{ steps.discover.outputs.execution-exit-code }}
  execution-reason-code:
    description: Reason code terminal sanitizado del CLI para un fallo reconocido.
    value: ${{ steps.discover.outputs.execution-reason-code }}
  evidence-json:
    description: Fuentes SQL V2 estructuradas y sanitizadas.
    value: ${{ steps.discover.outputs.evidence-json }}
  observed-server-instance:
    description: SERVERPROPERTY(ServerName) observado sobre la conexión target.
    value: ${{ steps.discover.outputs.observed-server-instance }}
  observed-database-name:
    description: DB_NAME() observado sobre la conexión target.
    value: ${{ steps.discover.outputs.observed-database-name }}
  observed-database-identity-json:
    description: Identidad SQL observada y sanitizada; vacía si target no fue exitoso.
    value: ${{ steps.discover.outputs.observed-database-identity-json }}
  connection-status:
    value: ${{ steps.discover.outputs.connection-status }}
  database-lookup-status:
    value: ${{ steps.discover.outputs.database-lookup-status }}
  target-connection-status:
    value: ${{ steps.discover.outputs.target-connection-status }}
  metadata-status:
    value: ${{ steps.discover.outputs.metadata-status }}
  physical-status:
    value: ${{ steps.discover.outputs.physical-status }}
  history-status:
    value: ${{ steps.discover.outputs.history-status }}

runs:
  using: composite
  steps:
    - name: Mask SQL connection
      shell: bash
      env:
        SQL_SERVER_CONNECTION: ${{ inputs.server-connection-string }}
      run: echo "::add-mask::$SQL_SERVER_CONNECTION"
    - name: Setup .NET for SQL Discovery V2
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
    - name: Discover SQL evidence in TEST (read only)
      id: discover
      shell: bash
      env:
        ENVIRONMENT_NAME: ${{ inputs.environment-name }}
        SQL_SERVER_CONNECTION: ${{ inputs.server-connection-string }}
        SQL_DATABASE_NAME: ${{ inputs.database-name }}
        SQL_TLS_MODE: ${{ inputs.tls-mode }}
      run: node "$GITHUB_ACTION_PATH/../scripts/run-sql-discovery-v2-public.mjs"
