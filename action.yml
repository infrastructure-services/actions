
name: 'Generic Build and Push'
description: 'Build y push de imagen Docker en Andreani y Witwot'

inputs:
  ACR_USERNAME:
    description: "user de acr"
    required: true
  ACR_PASSWORD:
    description: "password de acr"
    required: true
  ACR_NAME:
    description: "nombre del acr"
    required: true
  ACR_FULL_NAME:
    description: "nombre del acr con azurecr.io"
    required: true

  ACR_USERNAME_WITWOT:
    description: "user de acr de witwot"
    required: true
  ACR_PASSWORD_WITWOT:
    description: "password de acr de witwot"
    required: true
  ACR_NAME_WITWOT:
    description: "nombre del acr de witwot"
    required: true
  ACR_FULL_NAME_WITWOT:
    description: "nombre del acr de witwot con azurecr.io"
    required: true

  appName:
    description: "Nombre de la aplicacion"
    required: true
  teamProject:
    description: "Nombre del proyecto/equipo"
    required: true
  appVersion:
    description: "Tag de la imagen"
    required: true

  matrix_deploy:
    description: "Deploy en multiples ambientes"
    required: false
    default: "[]"

outputs:
  digest:
    description: "Digest de la imagen generada"
    value: ${{ steps.build.outputs.digest }}

runs:
  using: "composite"
  steps:

    #########################################################
    # GENERATE DOCKER TAGS
    #########################################################

    - name: Generate Docker Tags
      id: tags
      uses: actions/github-script@v8
      env:
        MATRIX_DEPLOY: ${{ inputs.matrix_deploy }}
        ACR_FULL_NAME: ${{ inputs.ACR_FULL_NAME }}
        ACR_FULL_NAME_WITWOT: ${{ inputs.ACR_FULL_NAME_WITWOT }}
        TEAM_PROJECT: ${{ inputs.teamProject }}
        APP_NAME: ${{ inputs.appName }}
        APP_VERSION: ${{ inputs.appVersion }}
      with:
        result-encoding: string
        script: |
          const matrixDeploy = JSON.parse(process.env.MATRIX_DEPLOY);

          if (!Array.isArray(matrixDeploy)) {
            throw new Error("matrix_deploy debe ser un array");
          }

          const registries = [
            process.env.ACR_FULL_NAME,
            process.env.ACR_FULL_NAME_WITWOT
          ];

          const project = process.env.TEAM_PROJECT;
          const app = process.env.APP_NAME;
          const version = process.env.APP_VERSION;

          const tags = [];

          registries.forEach(registry => {
            if (matrixDeploy.length > 0) {
              matrixDeploy.forEach(deploy => {
                tags.push(
                  `${registry}/${project}-${app}-${deploy}:${version}`
                );
              });
            } else {
              tags.push(
                `${registry}/${project}-${app}:${version}`
              );
            }
          });

          console.log("Tags generados:");
          console.log(tags.join('\n'));

          return tags.join('\n');

    #########################################################
    # CHECKOUT
    #########################################################

    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    #########################################################
    # DOCKER BUILDX
    #########################################################

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    #########################################################
    # LOGIN ANDREANI
    #########################################################

    - name: Login to Andreani ACR
      uses: azure/docker-login@v2
      with:
        login-server: ${{ inputs.ACR_NAME }}.azurecr.io
        username: ${{ inputs.ACR_USERNAME }}
        password: ${{ inputs.ACR_PASSWORD }}

    #########################################################
    # LOGIN WITWOT
    #########################################################

    - name: Login to Witwot ACR
      uses: azure/docker-login@v2
      with:
        login-server: ${{ inputs.ACR_NAME_WITWOT }}.azurecr.io
        username: ${{ inputs.ACR_USERNAME_WITWOT }}
        password: ${{ inputs.ACR_PASSWORD_WITWOT }}

    #########################################################
    # BUILD AND PUSH
    #########################################################

    - name: Build and push to Andreani and Witwot
      id: build
      uses: docker/build-push-action@v7
      env:
        DOCKER_BUILD_RECORD_UPLOAD: "false"
      with:
        context: .
        file: Dockerfile
        push: true
        tags: |
          ${{ steps.tags.outputs.result }}

    #########################################################
    # FINISHED
    #########################################################

    - name: Finish
      shell: bash
      run: |
        echo "Build y Push completado correctamente"
        echo "Registries: Andreani y Witwot"
