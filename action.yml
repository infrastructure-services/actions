name: Get Azure Key Vault Secret
description: Obtiene el valor de un secret desde Azure Key Vault usando REST API, sin Azure CLI

inputs:
  keyvault-name:
    description: Nombre del Azure Key Vault
    required: true

  secret-name:
    description: Nombre del secret dentro del Key Vault
    required: true

  client-id:
    description: Azure Service Principal Client ID
    required: true

  client-secret:
    description: Azure Service Principal Secret
    required: true

  tenant-id:
    description: Azure Tenant ID
    required: true

  keyvault-api-version:
    description: API version de Azure Key Vault
    required: false
    default: "2025-07-01"

outputs:
  secret-value:
    description: Valor del secret obtenido desde Key Vault
    value: ${{ steps.get_secret.outputs.secret_value }}

  secret-found:
    description: Indica si el secret existe en Key Vault
    value: ${{ steps.get_secret.outputs.secret_found }}

  error-code:
    description: Código de error controlado
    value: ${{ steps.get_secret.outputs.error_code }}

runs:
  using: composite
  steps:
    - name: Get secret from Azure Key Vault
      id: get_secret
      shell: bash
      env:
        KEYVAULT_NAME: ${{ inputs.keyvault-name }}
        SECRET_NAME: ${{ inputs.secret-name }}
        AZURE_CLIENT_ID: ${{ inputs.client-id }}
        AZURE_CLIENT_SECRET: ${{ inputs.client-secret }}
        AZURE_TENANT_ID: ${{ inputs.tenant-id }}
        KEYVAULT_API_VERSION: ${{ inputs.keyvault-api-version }}
      run: |
        set -euo pipefail

        umask 077

        TEMP_BASE="${RUNNER_TEMP:-/tmp}"
        TEMP_DIR="$(mktemp -d "${TEMP_BASE%/}/keyvault-secret.XXXXXX")"
        TOKEN_RESPONSE_FILE="$TEMP_DIR/token-response.json"
        RESPONSE_FILE="$TEMP_DIR/secret-response.json"

        cleanup() {
          echo "🧹 Limpiando archivos temporales de get-keyvault-secret..."
          rm -rf "$TEMP_DIR"
        }

        trap cleanup EXIT SIGINT SIGTERM

        append_multiline_output() {
          local NAME="$1"
          local VALUE="$2"
          local DELIMITER="EOF_${RANDOM}_${RANDOM}_$(date +%s)"

          {
            echo "${NAME}<<${DELIMITER}"
            printf '%s\n' "$VALUE"
            echo "${DELIMITER}"
          } >> "$GITHUB_OUTPUT"
        }

        write_outputs_not_found() {
          local ERROR_CODE="$1"

          {
            echo "secret_found=false"
            echo "error_code=${ERROR_CODE}"
          } >> "$GITHUB_OUTPUT"

          append_multiline_output "secret_value" ""
        }

        write_outputs_success() {
          local SECRET_VALUE="$1"

          {
            echo "secret_found=true"
            echo "error_code="
          } >> "$GITHUB_OUTPUT"

          append_multiline_output "secret_value" "$SECRET_VALUE"
        }

        print_response_error() {
          local FILE="$1"

          if [[ -f "$FILE" ]] && jq empty "$FILE" >/dev/null 2>&1; then
            jq -r '.error // .' "$FILE" || true
          elif [[ -f "$FILE" ]]; then
            head -c 2000 "$FILE" || true
            echo ""
          else
            echo "No hay response file disponible."
          fi
        }

        write_summary() {
          local SECRET_FOUND="$1"
          local ERROR_CODE="$2"

          {
            echo "### Azure Key Vault Secret"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            printf '| Key Vault | `%s` |\n' "$KEYVAULT_NAME"
            printf '| Secret name | `%s` |\n' "$SECRET_NAME"
            printf '| Secret found | `%s` |\n' "$SECRET_FOUND"
            printf '| Error code | `%s` |\n' "${ERROR_CODE:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
        }

        if [[ -z "${KEYVAULT_NAME:-}" ]]; then
          echo "❌ keyvault-name no informado"
          exit 1
        fi

        if [[ -z "${SECRET_NAME:-}" ]]; then
          echo "❌ secret-name no informado"
          exit 1
        fi

        if [[ -z "${AZURE_CLIENT_ID:-}" ]]; then
          echo "❌ client-id no informado"
          exit 1
        fi

        if [[ -z "${AZURE_CLIENT_SECRET:-}" ]]; then
          echo "❌ client-secret no informado"
          exit 1
        fi

        if [[ -z "${AZURE_TENANT_ID:-}" ]]; then
          echo "❌ tenant-id no informado"
          exit 1
        fi

        if [[ -z "${KEYVAULT_API_VERSION:-}" ]]; then
          echo "❌ keyvault-api-version no informado"
          exit 1
        fi

        if ! command -v curl >/dev/null 2>&1; then
          echo "❌ curl no está instalado en el runner"
          exit 1
        fi

        if ! command -v jq >/dev/null 2>&1; then
          echo "❌ jq no está instalado en el runner"
          exit 1
        fi

        echo "::add-mask::$AZURE_CLIENT_SECRET"

        echo "Obteniendo token de Azure..."

        set +e
        TOKEN_HTTP_CODE="$(curl -sS \
          -X POST \
          "https://login.microsoftonline.com/${AZURE_TENANT_ID}/oauth2/v2.0/token" \
          -H "Content-Type: application/x-www-form-urlencoded" \
          --connect-timeout 10 \
          --max-time 60 \
          -o "$TOKEN_RESPONSE_FILE" \
          -w "%{http_code}" \
          --data-urlencode "client_id=${AZURE_CLIENT_ID}" \
          --data-urlencode "client_secret=${AZURE_CLIENT_SECRET}" \
          --data-urlencode "grant_type=client_credentials" \
          --data-urlencode "scope=https://vault.azure.net/.default")"
        TOKEN_CURL_EXIT=$?
        set -e

        if [[ "$TOKEN_CURL_EXIT" -ne 0 ]]; then
          echo "❌ Error de red obteniendo token de Azure. curl exit code=${TOKEN_CURL_EXIT}"
          exit 1
        fi

        if [[ "$TOKEN_HTTP_CODE" -lt 200 || "$TOKEN_HTTP_CODE" -ge 300 ]]; then
          echo "❌ Error obteniendo token de Azure. HTTP_CODE=${TOKEN_HTTP_CODE}"
          print_response_error "$TOKEN_RESPONSE_FILE"
          exit 1
        fi

        if ! jq empty "$TOKEN_RESPONSE_FILE" >/dev/null 2>&1; then
          echo "❌ Azure no respondió JSON válido al pedir token"
          head -c 2000 "$TOKEN_RESPONSE_FILE" || true
          echo ""
          exit 1
        fi

        ACCESS_TOKEN="$(jq -r '.access_token // empty' "$TOKEN_RESPONSE_FILE")"

        if [[ -z "$ACCESS_TOKEN" ]]; then
          echo "❌ No se pudo obtener access_token"
          print_response_error "$TOKEN_RESPONSE_FILE"
          exit 1
        fi

        echo "::add-mask::$ACCESS_TOKEN"

        SECRET_URL="https://${KEYVAULT_NAME}.vault.azure.net/secrets/${SECRET_NAME}?api-version=${KEYVAULT_API_VERSION}"

        echo "Consultando secret en Key Vault"
        echo "Key Vault: ${KEYVAULT_NAME}"
        echo "Secret name: ${SECRET_NAME}"

        set +e
        HTTP_CODE="$(curl -sS \
          --connect-timeout 10 \
          --max-time 60 \
          -o "$RESPONSE_FILE" \
          -w "%{http_code}" \
          -H "Authorization: Bearer ${ACCESS_TOKEN}" \
          -H "Accept: application/json" \
          "$SECRET_URL")"
        CURL_EXIT=$?
        set -e

        if [[ "$CURL_EXIT" -ne 0 ]]; then
          echo "❌ Error de red consultando Key Vault. curl exit code=${CURL_EXIT}"
          exit 1
        fi

        if [[ "$HTTP_CODE" == "401" ]]; then
          echo "❌ Key Vault respondió 401 Unauthorized"
          echo "Validá tenant, client-id y client-secret."
          print_response_error "$RESPONSE_FILE"
          exit 1
        fi

        if [[ "$HTTP_CODE" == "403" ]]; then
          echo "❌ Key Vault respondió 403 Forbidden"
          echo "El Service Principal autenticó correctamente, pero no tiene permisos secrets/get sobre el Key Vault ${KEYVAULT_NAME}."
          print_response_error "$RESPONSE_FILE"
          exit 1
        fi

        if [[ "$HTTP_CODE" == "404" ]]; then
          echo "⚠️ Key Vault respondió 404 Not Found"
          echo "No existe el secret ${SECRET_NAME} en el Key Vault ${KEYVAULT_NAME}."
          print_response_error "$RESPONSE_FILE"

          write_outputs_not_found "SecretNotFound"
          write_summary "false" "SecretNotFound"

          echo "Se continúa sin secret. La lógica consumidora deberá saltear migraciones."
          exit 0
        fi

        if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 300 ]]; then
          echo "❌ Error consultando Key Vault. HTTP_CODE=${HTTP_CODE}"
          print_response_error "$RESPONSE_FILE"
          exit 1
        fi

        if ! jq empty "$RESPONSE_FILE" >/dev/null 2>&1; then
          echo "❌ Key Vault no respondió JSON válido"
          head -c 2000 "$RESPONSE_FILE" || true
          echo ""
          exit 1
        fi

        SECRET_VALUE="$(jq -r '.value // empty' "$RESPONSE_FILE")"

        if [[ -z "$SECRET_VALUE" ]]; then
          echo "❌ El secret fue encontrado pero no tiene value"

          {
            echo "secret_found=false"
            echo "error_code=EmptySecretValue"
          } >> "$GITHUB_OUTPUT"

          append_multiline_output "secret_value" ""
          write_summary "false" "EmptySecretValue"

          exit 1
        fi

        echo "::add-mask::$SECRET_VALUE"

        write_outputs_success "$SECRET_VALUE"
        write_summary "true" "none"

        echo "✅ Secret obtenido correctamente desde Key Vault"

