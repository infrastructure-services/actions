name: Get Wizard DB Secrets
description: Genera los nombres de secrets Owner a partir del APP_ID

inputs:
  app-id:
    description: APP_ID de la aplicación
    required: true

  owner-secret-suffix:
    description: Sufijo usado para identificar el secret Owner
    required: false
    default: "--DataAccessRegistry--Owner"

outputs:
  test-owner-secret:
    description: Secret name de TEST Owner
    value: ${{ steps.generate.outputs.test_owner_secret }}

  qa-owner-secret:
    description: Secret name de QA Owner
    value: ${{ steps.generate.outputs.qa_owner_secret }}

  prod-owner-secret:
    description: Secret name de PROD Owner
    value: ${{ steps.generate.outputs.prod_owner_secret }}

  owner-secrets-json:
    description: JSON con los secrets Owner por ambiente
    value: ${{ steps.generate.outputs.owner_secrets_json }}

runs:
  using: composite
  steps:
    - name: Generate DB secret names
      id: generate
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        OWNER_SECRET_SUFFIX: ${{ inputs.owner-secret-suffix }}
      run: |
        set -euo pipefail

        if [[ -z "${APP_ID:-}" ]]; then
          echo "❌ APP_ID no informado"
          exit 1
        fi

        if [[ -z "${OWNER_SECRET_SUFFIX:-}" ]]; then
          echo "❌ owner-secret-suffix no informado"
          exit 1
        fi

        TEST_SECRET="${APP_ID}-TEST${OWNER_SECRET_SUFFIX}"
        QA_SECRET="${APP_ID}-QA${OWNER_SECRET_SUFFIX}"
        PROD_SECRET="${APP_ID}-PROD${OWNER_SECRET_SUFFIX}"

        OWNER_SECRETS_JSON="{\"TEST\":\"${TEST_SECRET}\",\"QA\":\"${QA_SECRET}\",\"PROD\":\"${PROD_SECRET}\"}"

        {
          echo "test_owner_secret=$TEST_SECRET"
          echo "qa_owner_secret=$QA_SECRET"
          echo "prod_owner_secret=$PROD_SECRET"
          echo "owner_secrets_json=$OWNER_SECRETS_JSON"
        } >> "$GITHUB_OUTPUT"

        echo "✅ Secrets Owner generados correctamente"
        echo "TEST: $TEST_SECRET"
        echo "QA: $QA_SECRET"
        echo "PROD: $PROD_SECRET"

        {
          echo "### DB Secrets Owner"
          echo ""
          echo "| Ambiente | Secret Owner |"
          echo "|---|---|"
          echo "| TEST | \`$TEST_SECRET\` |"
          echo "| QA | \`$QA_SECRET\` |"
          echo "| PROD | \`$PROD_SECRET\` |"
        } >> "$GITHUB_STEP_SUMMARY"

