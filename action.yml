name: 'Genera los outputs para activar los despliegues correspondientes al Workflow'
description: 'Selecciona la mejor estrategia de activación de despliegue según los datos proporcionados'
inputs:
# Workflow Data
  WORKFLOW_CD:
    description: "Variable que define el tipo de pipeline que es (Standard -> Normal Andreani 2 registries)"
    required: false
    default: "standard"
  ## App Datas
  appdataJson:
    description: "Json de datos de la aplicación"
    required: true

outputs:
  dev:
    description: Activa Ambiente Dev
    value: ${{ steps.generator.outputs.dev }}
  test:
    description: Activa Ambiente Test o Sandbox
    value: ${{ steps.generator.outputs.test }}
  qa:
    description: Activa Ambiente QA
    value: ${{ steps.generator.outputs.qa }}
  preprod:
    description: Activa Ambiente preprod
    value: ${{ steps.generator.outputs.preprod }}    
  prod:
    description: Activa Ambiente Prod
    value: ${{ steps.generator.outputs.prod }}   
  hopprod:
    description: Activa Ambiente Prod de Hop para Multiorg
    value: ${{ steps.generator.outputs.hopprod }}   
  wwprod:
    description: Activa Ambiente Prod de Witwot para Multiorg
    value: ${{ steps.generator.outputs.wwprod }}   

## La funcionalidad se puede extender conforme se agregan workflows y para incluir extracción de workflow de appdata

runs:
  using: "composite"
  steps:
    - name: Extract outputs to use 
      shell: bash
      id: generator
      env:
        APPDATA: ${{ inputs.appdataJson }}
        WORKFLOW: ${{ inputs.WORKFLOW_CD }}
        RAMA: ${{ github.ref_name }}
      run: |-
        #Conformamos las de output para cada branch y caso de WORKFLOW_CD
        dev=false
        test=false
        qa=false
        preprod=false
        prod=false
        hopprod=false
        wwprod=false
        
        if [[ "$WORKFLOW" == "standard" ]]; then

            if [[ "$RAMA" == "main" || "$RAMA" == "develop" ]]; then
              test=true
            else
              test=false
            fi

            if [[ "$RAMA" == "main" ]]; then
              qa=true
            else
              qa=false
            fi

            if [[ "$RAMA" == "main" || "$RAMA" == "hotfix" ]]; then
              preprod=true
              prod=true
            else
              preprod=false
              prod=false
            fi

        elif [[ "$WORKFLOW" == "hop" ]]; then

            if [[ "$RAMA" == "main" || "$RAMA" == "develop" ]]; then
              test=true
            else
              test=false
            fi
            if [[ "$RAMA" == "main" || "$RAMA" == "hotfix" ]]; then
              prod=true
            else
              prod=false
            fi

        elif [[ "$WORKFLOW" == "witwot" ]]; then
            if [[ "$RAMA" == "main" || "$RAMA" == "develop" ]]; then
              test=true
              dev=true
            else
              dev=false
              test=false
            fi

            if [[ "$RAMA" == "main" ]]; then
              preprod=true
            else
              preprod=false
            fi

            if [[ "$RAMA" == "main" || "$RAMA" == "hotfix" ]]; then
              prod=true
            else
              prod=false
            fi

        elif [[ "$WORKFLOW" == "multiorg" ]]; then
            if [[ "$RAMA" == "main" || "$RAMA" == "develop" ]]; then
              test=true
            else
              test=false
            fi

            if [[ "$RAMA" == "main" ]]; then
              qa=true
            else
              qa=false
            fi
            if [[ "$RAMA" == "main" || "$RAMA" == "hotfix" ]]; then
              preprod=true
              prod=true
              hopprod=true
              wwprod=true
            else
              preprod=false
              prod=false
              hopprod=false
              wwprod=false
            fi
        elif [[ "$WORKFLOW" == "dms" ]]; then
            if [[ "$RAMA" == "develop" ]]; then
              test=true
              qa=true
            else
              test=false
            fi

            if [[ "$RAMA" == "main" ]]; then
              qa=true
            fi

            if [[ "$RAMA" == "main" || "$RAMA" == "hotfix" ]]; then
              preprod=true
              prod=true
            else
              preprod=false
              prod=false
            fi
        else
          echo "::warning::Se ejecutó el delivery desde una rama no soportada: $RAMA. Utilizar main, develop o hotfix"
        fi
        {
          echo "dev=$dev"
          echo "test=$test"
          echo "qa=$qa"
          echo "preprod=$preprod"
          echo "prod=$prod"
          echo "hopprod=$hopprod"
          echo "wwprod=$wwprod"
        } >> "$GITHUB_OUTPUT"