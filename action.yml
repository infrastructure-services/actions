name: 'Restart Service'

inputs:
  appName:
    description: "Nombre de la aplicacion (dentro del proyecto)"
    required: true
  restartMotive:
    description: "Motivo del Restart"
    required: true
  ARGO_USERNAME:
    description: "usuario de ARgocd"
    required: true
  ARGO_PASSWORD:
    description: "pass de ARgocd"
    required: true
  ARGO_URL:
    description: "url de ARgocd"
    required: true
  projectName:
    description: "nombre de namespaces"
    required: true
    default: ""
  environmentName:
    description: "Ambiente"
    required: true
    default: ""
runs:
  using: "composite"
  steps:
    - name: Start
      shell: bash
      run: |-
        echo "Comenzando a reiniciar el servicio."
        echo "----------------------------------------"
        echo ::notice::Motivo: ${{ inputs.restartMotive }}
        echo "----------------------------------------"
    - name: ArgoCD Login
      shell: bash
      run: |-
        echo "Login a ArgoCD"
        argocd login --username ${{ inputs.ARGO_USERNAME }} --password ${{ inputs.ARGO_PASSWORD }} --insecure ${{inputs.ARGO_URL}} --grpc-web
    - name: Restart Process
      shell: bash
      run: |-
        echo "Restarting Service"
        argocd app actions run ${{ inputs.projectName }}-${{ inputs.appName }}-${{ inputs.environmentName }} restart --kind Deployment
    - name: Wait
      shell: bash
      run: |-
        echo "Esperando que se estabilice"
        echo "----------------------------------------"
        argoWait="argocd app wait ${{ inputs.projectName }}-${{ inputs.appName }}-${{ inputs.environmentName }} --health --operation --timeout 30"
          for i in {1..3}
          do
          if eval "$argoWait"; then
                echo "Estabilizado OK"
                break
            else
                echo "Seguimos esperando $i/3"
                sleep 60
            fi
          done
    - name: End
      shell: bash
      run: |-
        echo "El servicio o app ha sido reiniciado"
        echo "----------------------------------------"
