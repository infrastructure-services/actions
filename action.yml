name: Build Lambda Node
description: 'Build lambda Node'

inputs:
  aws-access-key-id: 
    description: 'Id de la credencial de acceso de AWS'
    required: true
    type: string

  aws-secret-access-key: 
    description: 'Key de acceso a los secretos de AWS'
    required: true
    type: string

  aws-region: 
    description: 'Región'
    required: true
    type: string

  lambda-name:
    description: 'Nombre de la función'
    required: true
    type: string
    
runs:
  using: "composite"
  steps:
    - name: Checkout code 📥
      uses: actions/checkout@v4

    - name: Set up Node.js 🛠
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies 📦
      run: npm install
      shell: bash

    - name: Create deployment package 🗜️
      run: |
        zip -r main.zip . \
          -x "*.git*" \
          -x "*.github*" \
          -x "*.zip*" \
          -x "node_modules/.cache/*"
      shell: bash

    - name: Configure AWS credentials 🔐
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - name: Deploy to AWS Lambda 🚀
      run: |
        aws lambda update-function-code --function-name ${{ inputs.lambda-name }} --zip-file fileb://main.zip
      shell: bash

