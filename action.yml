name: 'Generic Build and Push'
description: 'Build y push de imagen de docker'
inputs:
# ACR Datas
  ACR_USERNAME:
    description: "user de acr"
    required: true
  ACR_PASSWORD:
    description: "password de acr"
    required: true
  ACR_NAME:
    description: "nombre del acr"
    required: true
  ACR_FULL_NAME:
    description: "nombre del acr con azurecr.io"
    required: true
#ACR WW Datas 
  ACR_USERNAMEWW:
    description: "user de acr"
    required: true
  ACR_PASSWORDWW:
    description: "password de acr"
    required: true
  ACR_NAMEWW:
    description: "nombre del acr"
    required: true
  ACR_FULL_NAMEWW:
    description: "nombre del acr con azurecr.io"
    required: true
#ECR HOP Datas
  ECR_ID:
    description: "user de acr"
    required: true
  ECR_PASSWORD:
    description: "password de acr"
    required: true
  SWR_USERNAME:
    description: "user de acr"
    required: true
  SWR_PASSWORD:
    description: "password de acr"
    required: true
  SWR_NAME:
    description: "nombre de la organizacion de SWR"
    required: true
  SWR_URL:
    description: "url de swr"
    required: true

  ## App Datas
  appName:
    description: "Nombre de la aplicacion (dentro del proyecto)"
    required: true
  teamProject:
    description: "Nombre del proyecto/equipo"
    required: true
  appVersion:
    description: "tag para subir imagen"
    required: true
  matrix_deploy:
    description: "deploy en multiples ambientes"
    required: false
    default: "[]"
  
  andreani:
    description: "Se pushea a la registry de Andreani"
    required: false
    type: boolean
    default: true
  witwot:
    description: "Se pushea a la registry de Witwot"
    required: true
    type: boolean
    default: false
  hop:
    description: "Se pushea a la registry de HOP"
    required: true
    type: boolean
    default: false


runs:
  using: "composite"
  steps:
      - name: Generate Docker Tags
        id: tags
        uses: actions/github-script@v7
        with:
          script: |
            let tags = [];
            let matrix_deploy = ${{ inputs.matrix_deploy }};
            if (matrix_deploy.length > 0) {
              matrix_deploy.forEach(deploy => {
                let tag = `${{ inputs.ACR_FULL_NAME }}/${{inputs.teamProject}}-${{inputs.appName}}-${deploy}:${{ inputs.appVersion}}`
                tags.push(tag);
              });
            } else {
              tags.push(`${{ inputs.ACR_FULL_NAME }}/${{inputs.teamProject}}-${{inputs.appName}}:${{ inputs.appVersion}}`);
            }
            tags.push(`${{ inputs.ACR_FULL_NAME }}/${{inputs.teamProject}}-${{inputs.appName}}:ultima`);
            return tags.join('\n');
          result-encoding: string

      - name: "Debug echos"
        id: version
        shell: bash
        run: |
              echo "Tags Creados"
              echo "${{ steps.tags.outputs.result }}"


      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: setear docker
        uses: docker/setup-buildx-action@v3
        with:
            install: true
            
      - name: Login to Azure Container Registry Andreani
        if: ${{ inputs.andreani }}
        uses: azure/docker-login@v1
        with:
          login-server: ${{ inputs.ACR_FULL_NAME }}
          username: ${{ inputs.ACR_USERNAME }}
          password: ${{ inputs.ACR_PASSWORD }}



      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: . 
          file: Dockerfile 
          push: true
          tags: |
            ${{ steps.tags.outputs.result }}

      - name: Login to Azure Container Registry Witwot
        if: ${{ inputs.witwot }}
        uses: azure/docker-login@v1
        with:
          login-server: ${{ inputs.ACR_FULL_NAMEWW }}
          username: ${{ inputs.ACR_USERNAMEWW }}
          password: ${{ inputs.ACR_PASSWORDWW }}

#tags.push(`witwotcr.azurecr.io/${{inputs.teamProject}}-${{inputs.appName}}:${{ inputs.appVersion}}`);
      - name: Push image to Azure Container Registry Witwot
        if: ${{ inputs.witwot }}
        shell: bash
        run: |
          docker buildx imagetools create \
            --tag witwotcr.azurecr.io/${{inputs.teamProject}}-${{inputs.appName}}:${{ inputs.appVersion}} \
            ${{ inputs.ACR_FULL_NAME }}/${{inputs.teamProject}}-${{inputs.appName}}:ultima

#tags.push(`public.ecr.aws/hopenvios-sbx/${{inputs.teamProject}}-${{inputs.appName}}:${{ inputs.appVersion}}`);


      - name: Login to Huawei SWR
        if: ${{ inputs.witwot }}
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.SWR_URL }}
          username: ${{ inputs.SWR_USERNAME }}
          password: ${{ inputs.SWR_PASSWORD }}
      - name: Push image to Huawei SWR
        if: ${{ inputs.witwot }}
        shell: bash
        run: |
          docker buildx imagetools create \
            --tag ${{ inputs.SWR_URL }}/${{ inputs.SWR_NAME }}/${{ inputs.teamProject }}-${{ inputs.appName }}:${{ inputs.appVersion }} \
            ${{ inputs.ACR_FULL_NAME }}/${{ inputs.teamProject }}-${{ inputs.appName }}:ultima
