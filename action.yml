name: Validate SQL Server Connection
description: Valida conectividad TCP y conexión SQL Server usando una connection string

inputs:
  connection-string:
    description: Connection string de SQL Server
    required: true

  dotnet-version:
    description: Versión esperada de .NET SDK
    required: false
    default: "10.0.x"

  test-framework:
    description: Framework usado por el proyecto temporal
    required: false
    default: "net10.0"

  connection-timeout:
    description: Timeout de conexión SQL en segundos
    required: false
    default: "15"

outputs:
  normalized-connection-string:
    description: Connection string normalizada
    value: ${{ steps.validate.outputs.normalized_connection_string }}

  data-source:
    description: DataSource detectado desde la connection string
    value: ${{ steps.validate.outputs.data_source }}

  database:
    description: Database detectada desde la connection string
    value: ${{ steps.validate.outputs.database }}

runs:
  using: composite
  steps:
    - name: Validar dotnet instalado en el runner
      shell: bash
      env:
        DOTNET_VERSION_EXPECTED: ${{ inputs.dotnet-version }}
      run: |
        set -euo pipefail

        if ! command -v dotnet >/dev/null 2>&1; then
          echo "❌ dotnet no está instalado o no está en el PATH del runner."
          exit 1
        fi

        echo "Validando dotnet instalado en el runner..."
        echo "dotnet path:"
        which dotnet

        echo ""
        echo "dotnet --info:"
        dotnet --info

        echo ""
        echo "SDKs instalados:"
        dotnet --list-sdks

        EXPECTED_MAJOR="$(echo "${DOTNET_VERSION_EXPECTED:-}" | sed -E 's/^([0-9]+).*/\1/')"

        if [[ -n "$EXPECTED_MAJOR" ]]; then
          if ! dotnet --list-sdks | grep -Eq "^${EXPECTED_MAJOR}\."; then
            echo "❌ No se encontró .NET SDK ${EXPECTED_MAJOR}.x instalado en el runner."
            exit 1
          fi

          echo "✅ .NET SDK ${EXPECTED_MAJOR}.x encontrado"
        fi

    - name: Validate SQL Server connection
      id: validate
      shell: bash
      env:
        DB_CONNECTION: ${{ inputs.connection-string }}
        CONNECTION_TIMEOUT: ${{ inputs.connection-timeout }}
        TEST_FRAMEWORK: ${{ inputs.test-framework }}
      run: |
        set -euo pipefail

        append_multiline_output() {
          local NAME="$1"
          local VALUE="$2"
          local DELIMITER="EOF_${RANDOM}_${RANDOM}_$(date +%s)"

          {
            echo "${NAME}<<${DELIMITER}"
            printf '%s\n' "$VALUE"
            echo "${DELIMITER}"
          } >> "$GITHUB_OUTPUT"
        }

        if [[ -z "${DB_CONNECTION:-}" ]]; then
          echo "❌ La connection string está vacía"
          exit 1
        fi

        echo "::add-mask::$DB_CONNECTION"

        NORMALIZED="$DB_CONNECTION"

        if ! echo "$NORMALIZED" | grep -Eiq '(^|;)Encrypt='; then
          NORMALIZED="${NORMALIZED};Encrypt=True"
        fi

        if ! echo "$NORMALIZED" | grep -Eiq '(^|;)TrustServerCertificate='; then
          NORMALIZED="${NORMALIZED};TrustServerCertificate=True"
        fi

        if ! echo "$NORMALIZED" | grep -Eiq '(^|;)Connection Timeout='; then
          NORMALIZED="${NORMALIZED};Connection Timeout=${CONNECTION_TIMEOUT}"
        fi

        echo "::add-mask::$NORMALIZED"

        WORKDIR="$(mktemp -d)"

        cleanup() {
          rm -rf "$WORKDIR"
        }

        trap cleanup EXIT SIGINT SIGTERM

        cd "$WORKDIR"

        echo "Creando proyecto temporal para validar SQL Server..."
        echo "Framework: ${TEST_FRAMEWORK}"

        dotnet new console --framework "$TEST_FRAMEWORK" --no-restore >/dev/null
        dotnet add package Microsoft.Data.SqlClient >/dev/null

        cat > Program.cs <<'EOF'
        using Microsoft.Data.SqlClient;
        using System.Net.Sockets;

        var connectionString = Environment.GetEnvironmentVariable("DB_CONNECTION");

        if (string.IsNullOrWhiteSpace(connectionString))
        {
            Console.Error.WriteLine("❌ Connection string vacía");
            Environment.Exit(1);
        }

        SqlConnectionStringBuilder builder;

        try
        {
            builder = new SqlConnectionStringBuilder(connectionString);
        }
        catch (Exception ex)
        {
            Console.Error.WriteLine("❌ La connection string no tiene un formato válido");
            Console.Error.WriteLine(ex.Message);
            Environment.Exit(1);
            return;
        }

        var dataSource = builder.DataSource;
        var database = builder.InitialCatalog;

        Console.WriteLine("Diagnóstico seguro:");
        Console.WriteLine($"DataSource: {dataSource}");
        Console.WriteLine($"Database: {database}");
        Console.WriteLine($"Encrypt: {builder.Encrypt}");
        Console.WriteLine($"TrustServerCertificate: {builder.TrustServerCertificate}");
        Console.WriteLine($"ConnectionTimeout: {builder.ConnectTimeout}");

        if (string.IsNullOrWhiteSpace(dataSource))
        {
            Console.Error.WriteLine("❌ La connection string no contiene Server/Data Source");
            Environment.Exit(1);
        }

        if (string.IsNullOrWhiteSpace(database))
        {
            Console.Error.WriteLine("❌ La connection string no contiene Database/Initial Catalog");
            Environment.Exit(1);
        }

        var serverForTcp = dataSource
            .Replace("tcp:", "", StringComparison.OrdinalIgnoreCase)
            .Trim();

        var tcpHost = serverForTcp;
        var tcpPort = 1433;

        if (serverForTcp.Contains(","))
        {
            var parts = serverForTcp.Split(',', 2);
            tcpHost = parts[0];

            if (int.TryParse(parts[1], out var parsedPort))
            {
                tcpPort = parsedPort;
            }
        }

        if (tcpHost.Contains("\\"))
        {
            Console.WriteLine("⚠️ El DataSource usa instancia SQL con backslash.");
            Console.WriteLine("⚠️ En runners Linux es mejor usar host,puerto.");
            Console.WriteLine("Ejemplo: Server=tcp:mi-servidor,1433;Database=...");
            tcpHost = tcpHost.Split('\\')[0];
        }

        Console.WriteLine($"TCP Host detectado: {tcpHost}");
        Console.WriteLine($"TCP Port detectado: {tcpPort}");

        try
        {
            Console.WriteLine("Validando conectividad TCP...");

            using var tcpClient = new TcpClient();

            var connectTask = tcpClient.ConnectAsync(tcpHost, tcpPort);
            var timeoutTask = Task.Delay(TimeSpan.FromSeconds(10));

            var completedTask = await Task.WhenAny(connectTask, timeoutTask);

            if (completedTask == timeoutTask)
            {
                Console.Error.WriteLine($"❌ Timeout conectando por TCP a {tcpHost}:{tcpPort}");
                Console.Error.WriteLine("Probable causa: red, firewall, DNS, ruta o puerto cerrado desde el runner.");
                Environment.Exit(1);
            }

            await connectTask;

            Console.WriteLine($"✅ TCP OK contra {tcpHost}:{tcpPort}");
        }
        catch (Exception ex)
        {
            Console.Error.WriteLine($"❌ No se pudo abrir conexión TCP a {tcpHost}:{tcpPort}");
            Console.Error.WriteLine(ex.Message);
            Environment.Exit(1);
        }

        try
        {
            Console.WriteLine("Intentando abrir conexión SQL Server...");

            await using var connection = new SqlConnection(connectionString);
            await connection.OpenAsync();

            await using var command = connection.CreateCommand();
            command.CommandText = "SELECT DB_NAME()";

            var databaseName = await command.ExecuteScalarAsync();

            await using var testCommand = connection.CreateCommand();
            testCommand.CommandText = "SELECT 1";

            var result = await testCommand.ExecuteScalarAsync();

            Console.WriteLine($"✅ Conexión SQL válida contra la base: {databaseName}");
            Console.WriteLine($"✅ SELECT 1 OK: {result}");
        }
        catch (SqlException ex)
        {
            Console.Error.WriteLine("❌ Error SQL al validar conexión");
            Console.Error.WriteLine($"Number: {ex.Number}");
            Console.Error.WriteLine($"Message: {ex.Message}");

            if (ex.Number == 258)
            {
                Console.Error.WriteLine("");
                Console.Error.WriteLine("Diagnóstico probable:");
                Console.Error.WriteLine("- El runner no llega al SQL Server.");
                Console.Error.WriteLine("- El DNS no resuelve desde el runner.");
                Console.Error.WriteLine("- El firewall no permite el puerto SQL.");
                Console.Error.WriteLine("- La base está en una red privada no accesible desde este grupo de runners.");
            }

            if (ex.Number == 18456)
            {
                Console.Error.WriteLine("");
                Console.Error.WriteLine("Diagnóstico probable:");
                Console.Error.WriteLine("- Usuario o password incorrectos.");
                Console.Error.WriteLine("- El login no tiene permisos sobre la base.");
            }

            Environment.Exit(1);
        }
        catch (Exception ex)
        {
            Console.Error.WriteLine("❌ Error general al validar conexión SQL");
            Console.Error.WriteLine(ex.Message);
            Environment.Exit(1);
        }
        EOF

        echo "Ejecutando validación SQL Server..."

        set +e
        VALIDATION_OUTPUT="$(DB_CONNECTION="$NORMALIZED" dotnet run --configuration Release 2>&1)"
        VALIDATION_EXIT_CODE=$?
        set -e

        echo "$VALIDATION_OUTPUT"

        DATA_SOURCE="$(printf '%s\n' "$VALIDATION_OUTPUT" | sed -n 's/^DataSource: //p' | head -n 1)"
        DATABASE="$(printf '%s\n' "$VALIDATION_OUTPUT" | sed -n 's/^Database: //p' | head -n 1)"

        append_multiline_output "normalized_connection_string" "$NORMALIZED"

        {
          echo "data_source=${DATA_SOURCE}"
          echo "database=${DATABASE}"
        } >> "$GITHUB_OUTPUT"

        {
          echo "### SQL Server"
          echo ""
          echo "| Campo | Valor |"
          echo "|---|---|"
          printf '| DataSource | `%s` |\n' "${DATA_SOURCE:-No detectado}"
          printf '| Database | `%s` |\n' "${DATABASE:-No detectada}"
        } >> "$GITHUB_STEP_SUMMARY"

        if [[ "$VALIDATION_EXIT_CODE" -ne 0 ]]; then
          echo "❌ Falló la validación SQL Server"
          exit "$VALIDATION_EXIT_CODE"
        fi

        echo "✅ Connection string validada correctamente"

