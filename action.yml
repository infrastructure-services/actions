name: Build Lambda Node

on:
  workflow_call:
    inputs:
      aws-access-key-id: 
        description: 'Id de la credencial de acceso de AWS'
        required: true
        type: string

      aws-secret-access-key: 
        description: 'Key de acceso a los secretos de AWS'
        required: true
        type: string

      aws-region: 
        description: 'Región'
        required: true
        type: string

      lambda-name:
        description: 'Nombre de la función'
        required: true
        type: string
    
runs:
  using: "composite"
  steps:
    - name: Checkout code 📥
      uses: actions/checkout@v4

    - name: Set up Node.js 🛠
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies 📦
      run: npm install
      shell: bash

    - name: Run tests 🧪
      run: npm test
      shell: bash

    - name: Build Node.js app 🏗️
      run: npm run build
      shell: bash

    - name: Package app 📦
      run: zip -r main.zip ./
      shell: bash

    - name: Configure AWS credentials 🔐
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - name: Deploy to AWS Lambda 🚀
      run: |
        aws lambda update-function-code --function-name ${{ inputs.lambda-name }} --zip-file fileb://main.zip
      shell: bash

