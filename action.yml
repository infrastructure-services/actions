name: Validate EF Core Migrations
description: Valida migraciones EF Core contra una base SQL Server usando connection string

inputs:
  connection-string:
    description: Connection string de SQL Server
    required: true

  project:
    description: Proyecto donde están las migraciones. Si se deja vacío, se autodetecta.
    required: false
    default: ""

  startup-project:
    description: Proyecto startup. Ejemplo ./src/Api/Api.csproj
    required: true

  db-context:
    description: Nombre del DbContext. Requerido si hay más de uno.
    required: false
    default: ""

  configuration:
    description: Configuración de build
    required: false
    default: "Release"

  dotnet-version:
    description: Versión de .NET SDK a instalar. Dejar vacío si el runner ya tiene dotnet.
    required: false
    default: "10.0.x"

  ef-tool-version:
    description: Versión de dotnet-ef. Ejemplo 8.0.0
    required: false
    default: "10.0.5"

  validate-model-changes:
    description: Ejecuta dotnet ef migrations has-pending-model-changes
    required: false
    default: "true"

  fail-if-no-migrations:
    description: Falla si no encuentra migraciones en el repo
    required: false
    default: "false"

  environment-name:
    description: Nombre del ambiente analizado. Ejemplo TEST, QA o PROD.
    required: false
    default: "UNKNOWN"

  fail-on-pending:
    description: Falla si existen migraciones pendientes.
    required: false
    default: "true"

  fail-on-risk-level:
    description: Falla si el riesgo es igual o superior a este nivel. Valores NONE, LOW, MEDIUM, HIGH. Vacío no falla por riesgo.
    required: false
    default: ""

  show-sql-in-logs:
    description: Muestra el SQL generado en los logs de GitHub Actions.
    required: false
    default: "true"

  sql-log-max-lines:
    description: Cantidad máxima de líneas SQL a mostrar en logs. Usar 0 para mostrar todo.
    required: false
    default: "500"

outputs:
  has-pending-db-migrations:
    description: Indica si la base tiene migraciones pendientes
    value: ${{ steps.validate.outputs.has_pending_db_migrations }}

  pending-migrations:
    description: Lista de migraciones pendientes
    value: ${{ steps.validate.outputs.pending_migrations }}

  migration-risk:
    description: Riesgo calculado de las migraciones pendientes
    value: ${{ steps.validate.outputs.migration_risk }}

  requires-dba:
    description: Indica si requiere revisión DBA
    value: ${{ steps.validate.outputs.requires_dba }}

  analysis-dir:
    description: Carpeta donde se generó el SQL y resumen de análisis
    value: ${{ steps.validate.outputs.analysis_dir }}

  sql-files:
    description: Archivos SQL generados
    value: ${{ steps.validate.outputs.sql_files }}

runs:
  using: composite
  steps:
    - name: Setup .NET
      if: ${{ inputs.dotnet-version != '' }}
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Validate EF Core migrations
      id: validate
      shell: bash
      env:
        DB_CONNECTION: ${{ inputs.connection-string }}
        PROJECT: ${{ inputs.project }}
        STARTUP_PROJECT: ${{ inputs.startup-project }}
        DB_CONTEXT: ${{ inputs.db-context }}
        CONFIGURATION: ${{ inputs.configuration }}
        EF_TOOL_VERSION: ${{ inputs.ef-tool-version }}
        VALIDATE_MODEL_CHANGES: ${{ inputs.validate-model-changes }}
        FAIL_IF_NO_MIGRATIONS: ${{ inputs.fail-if-no-migrations }}
        ENVIRONMENT_NAME: ${{ inputs.environment-name }}
        FAIL_ON_PENDING: ${{ inputs.fail-on-pending }}
        FAIL_ON_RISK_LEVEL: ${{ inputs.fail-on-risk-level }}
        SHOW_SQL_IN_LOGS: ${{ inputs.show-sql-in-logs }}
        SQL_LOG_MAX_LINES: ${{ inputs.sql-log-max-lines }}
      run: |
        set -euo pipefail

        if [[ -z "${DB_CONNECTION:-}" ]]; then
          echo "❌ connection-string no informada"
          exit 1
        fi

        if [[ -z "${STARTUP_PROJECT:-}" ]]; then
          echo "❌ startup-project no informado"
          exit 1
        fi

        echo "::add-mask::$DB_CONNECTION"

        risk_value() {
          case "${1^^}" in
            NONE) echo 0 ;;
            LOW) echo 1 ;;
            MEDIUM) echo 2 ;;
            HIGH) echo 3 ;;
            *) echo 0 ;;
          esac
        }

        max_risk() {
          local CURRENT="$1"
          local NEW="$2"

          if (( $(risk_value "$NEW") > $(risk_value "$CURRENT") )); then
            echo "$NEW"
          else
            echo "$CURRENT"
          fi
        }

        safe_name() {
          local VALUE="$1"

          VALUE="${VALUE#./}"
          VALUE="$(echo "$VALUE" \
            | sed 's#[/\\: ]#_#g' \
            | sed 's#__#_#g' \
            | sed 's#^[._-]*##' \
            | sed 's#[._-]*$##')"

          if [[ -z "$VALUE" ]]; then
            VALUE="migration_project"
          fi

          echo "$VALUE"
        }

        classify_sql_risk() {
          local SQL_FILE="$1"
          local FINDINGS_FILE="$2"
          local RISK="LOW"

          : > "$FINDINGS_FILE"

          SQL_WITHOUT_HISTORY="$(mktemp)"
          grep -vi "__EFMigrationsHistory" "$SQL_FILE" > "$SQL_WITHOUT_HISTORY" || true

          add_finding() {
            local LEVEL="$1"
            local MESSAGE="$2"

            echo "- **${LEVEL}**: ${MESSAGE}" >> "$FINDINGS_FILE"
            RISK="$(max_risk "$RISK" "$LEVEL")"
          }

          if grep -Eiq '(CREATE([[:space:]]+OR[[:space:]]+ALTER)?|DROP|ALTER)[[:space:]]+TRIGGER' "$SQL_WITHOUT_HISTORY"; then
            add_finding "HIGH" "Detecta CREATE, DROP o ALTER de TRIGGER. Puede modificar lógica automática de base, afectar datos o impactar operaciones DML."
          fi

          if grep -Eiq 'DROP[[:space:]]+TABLE' "$SQL_WITHOUT_HISTORY"; then
            add_finding "HIGH" "Detecta DROP TABLE. Puede eliminar tablas y datos."
          fi

          if grep -Eiq 'DROP[[:space:]]+COLUMN' "$SQL_WITHOUT_HISTORY"; then
            add_finding "HIGH" "Detecta DROP COLUMN. Puede eliminar datos de una columna."
          fi

          if grep -Eiq 'TRUNCATE[[:space:]]+TABLE' "$SQL_WITHOUT_HISTORY"; then
            add_finding "HIGH" "Detecta TRUNCATE TABLE. Elimina datos masivamente."
          fi

          if grep -Eiq 'DELETE[[:space:]]+FROM' "$SQL_WITHOUT_HISTORY"; then
            add_finding "HIGH" "Detecta DELETE FROM. Puede eliminar datos."
          fi

          if grep -Eiq 'ALTER[[:space:]]+COLUMN' "$SQL_WITHOUT_HISTORY"; then
            add_finding "HIGH" "Detecta ALTER COLUMN. Puede requerir lock, conversión de datos o fallar por incompatibilidad."
          fi

          if grep -Eiq 'sp_rename|RENAME[[:space:]]+COLUMN|RENAME[[:space:]]+TABLE' "$SQL_WITHOUT_HISTORY"; then
            add_finding "HIGH" "Detecta rename de tabla/columna. Puede impactar dependencias."
          fi

          if grep -Eiq 'ALTER[[:space:]]+TABLE.*DROP[[:space:]]+CONSTRAINT|DROP[[:space:]]+CONSTRAINT' "$SQL_WITHOUT_HISTORY"; then
            add_finding "MEDIUM" "Detecta DROP CONSTRAINT. Puede afectar integridad referencial o índices."
          fi

          if grep -Eiq 'ADD[[:space:]]+CONSTRAINT|FOREIGN[[:space:]]+KEY|UNIQUE' "$SQL_WITHOUT_HISTORY"; then
            add_finding "MEDIUM" "Detecta creación de constraints, foreign keys o unique constraints."
          fi

          if grep -Eiq 'CREATE[[:space:]]+(UNIQUE[[:space:]]+)?INDEX' "$SQL_WITHOUT_HISTORY"; then
            add_finding "MEDIUM" "Detecta CREATE INDEX. Puede generar locks o impacto de performance."
          fi

          if grep -Eiq 'UPDATE[[:space:]]+' "$SQL_WITHOUT_HISTORY"; then
            add_finding "MEDIUM" "Detecta UPDATE de datos."
          fi

          if grep -Eiq 'ALTER[[:space:]]+TABLE.*ADD.*NOT[[:space:]]+NULL|ADD[[:space:]].*NOT[[:space:]]+NULL' "$SQL_WITHOUT_HISTORY"; then
            add_finding "MEDIUM" "Detecta columna NOT NULL nueva o cambio a NOT NULL."
          fi

          if grep -Eiq 'CREATE[[:space:]]+TABLE' "$SQL_WITHOUT_HISTORY"; then
            add_finding "LOW" "Detecta CREATE TABLE."
          fi

          if grep -Eiq 'ALTER[[:space:]]+TABLE.*ADD|ADD[[:space:]]+\[' "$SQL_WITHOUT_HISTORY"; then
            add_finding "LOW" "Detecta agregado de columnas o alteraciones aditivas."
          fi

          if [[ ! -s "$FINDINGS_FILE" ]]; then
            echo "- **LOW**: No se detectaron operaciones destructivas conocidas. Revisar SQL igualmente." >> "$FINDINGS_FILE"
            RISK="LOW"
          fi

          rm -f "$SQL_WITHOUT_HISTORY"

          echo "$RISK"
        }

        show_sql_file() {
          local SQL_FILE="$1"
          local TITLE="$2"

          if [[ "${SHOW_SQL_IN_LOGS}" != "true" ]]; then
            return
          fi

          echo ""
          echo "=========================================="
          echo "$TITLE"
          echo "Archivo: $SQL_FILE"
          echo "=========================================="

          TOTAL_LINES="$(wc -l < "$SQL_FILE" | tr -d ' ')"
          MAX_LINES="${SQL_LOG_MAX_LINES:-500}"

          if [[ "$MAX_LINES" == "0" ]]; then
            cat "$SQL_FILE"
          else
            sed -n "1,${MAX_LINES}p" "$SQL_FILE"

            if [[ "$TOTAL_LINES" -gt "$MAX_LINES" ]]; then
              echo ""
              echo "⚠️ SQL truncado en logs."
              echo "Total de líneas: $TOTAL_LINES"
              echo "Líneas mostradas: $MAX_LINES"
              echo "Descargar el artifact para ver el SQL completo."
            fi
          fi

          echo ""
          echo "=========================================="
          echo "FIN SQL"
          echo "=========================================="
        }

        echo "Validando disponibilidad de dotnet..."
        dotnet --info

        echo ""
        echo "Validando startup project..."
        echo "Startup project informado: $STARTUP_PROJECT"

        if [[ ! -f "$STARTUP_PROJECT" ]]; then
          echo "❌ No existe el startup-project: $STARTUP_PROJECT"
          echo ""
          echo "Proyectos encontrados:"
          find . -name "*.csproj" -not -path "*/bin/*" -not -path "*/obj/*" -print
          exit 1
        fi

        echo "✅ Startup project encontrado"

        detect_migration_projects() {
          if [[ -n "${PROJECT:-}" ]]; then
            if [[ ! -f "$PROJECT" ]]; then
              echo "❌ No existe el project informado: $PROJECT" >&2
              exit 1
            fi

            echo "$PROJECT"
            return
          fi

          find . \
            -path "*/Migrations/*.cs" \
            -not -path "*/bin/*" \
            -not -path "*/obj/*" \
            -not -name "*.Designer.cs" \
            -not -name "*ModelSnapshot.cs" \
            -print \
            | while read -r migration_file; do
                dir="$(dirname "$migration_file")"

                while [[ "$dir" != "." && "$dir" != "/" ]]; do
                  csproj="$(find "$dir" -maxdepth 1 -name "*.csproj" -print | head -n 1 || true)"

                  if [[ -n "$csproj" ]]; then
                    if grep -q '<Project Sdk=' "$csproj"; then
                      echo "$csproj"
                    else
                      echo "⚠️ Ignorando proyecto no SDK-style: $csproj" >&2
                    fi

                    break
                  fi

                  dir="$(dirname "$dir")"
                done
              done \
            | sort -u
        }

        echo ""
        echo "Detectando proyectos con migraciones..."
        MIGRATION_PROJECTS="$(detect_migration_projects || true)"

        ANALYSIS_ROOT="${GITHUB_WORKSPACE:-$PWD}/artifacts/ef-migrations/$(safe_name "${ENVIRONMENT_NAME:-UNKNOWN}")"
        mkdir -p "$ANALYSIS_ROOT"

        if [[ -z "$MIGRATION_PROJECTS" ]]; then
          echo "⚠️ No se encontraron migraciones en el repo."

          {
            echo "has_pending_db_migrations=false"
            echo "migration_risk=NONE"
            echo "requires_dba=false"
            echo "analysis_dir=$ANALYSIS_ROOT"
            echo "sql_files<<EOF"
            echo ""
            echo "EOF"
            echo "pending_migrations<<EOF"
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [[ "$FAIL_IF_NO_MIGRATIONS" == "true" ]]; then
            echo "❌ fail-if-no-migrations=true, se corta el workflow."
            exit 1
          fi

          echo "✅ No hay migraciones para validar."
          exit 0
        fi

        echo "Proyectos con migraciones detectados:"
        echo "$MIGRATION_PROJECTS"

        echo ""
        echo "Restaurando dependencias..."

        BUILD_TARGET=""
        SLN_FILE="$(find . -maxdepth 2 -name "*.sln" -print | head -n 1 || true)"

        if [[ -n "$SLN_FILE" ]]; then
          BUILD_TARGET="$SLN_FILE"
          echo "Usando solution: $BUILD_TARGET"
        else
          BUILD_TARGET="$STARTUP_PROJECT"
          echo "Usando startup project como build target: $BUILD_TARGET"
        fi

        dotnet restore "$BUILD_TARGET"

        echo ""
        echo "Compilando..."
        dotnet build "$BUILD_TARGET" --no-restore --configuration "$CONFIGURATION"

        echo ""
        echo "Configurando dotnet-ef..."

        TOOLS_DIR="${RUNNER_TEMP:-/tmp}/dotnet-ef-tools-${GITHUB_RUN_ID:-local}-${GITHUB_JOB:-job}"
        rm -rf "$TOOLS_DIR"
        mkdir -p "$TOOLS_DIR"

        if [[ -n "${EF_TOOL_VERSION:-}" ]]; then
          echo "Instalando dotnet-ef versión $EF_TOOL_VERSION en tool-path temporal..."
          dotnet tool install dotnet-ef \
            --tool-path "$TOOLS_DIR" \
            --version "$EF_TOOL_VERSION"
        else
          echo "Instalando dotnet-ef latest en tool-path temporal..."
          dotnet tool install dotnet-ef \
            --tool-path "$TOOLS_DIR"
        fi

        EF_CMD=("$TOOLS_DIR/dotnet-ef")

        echo "dotnet-ef instalado:"
        "${EF_CMD[@]}" --version

        HAS_PENDING=false
        OVERALL_RISK="NONE"
        ALL_PENDING_MIGRATIONS=""
        SQL_FILES=""

        SUMMARY_FILE="$ANALYSIS_ROOT/migration-risk-summary.md"

        {
          echo "# Análisis de migraciones EF Core"
          echo ""
          echo "| Campo | Valor |"
          echo "|---|---|"
          echo "| Ambiente | ${ENVIRONMENT_NAME:-UNKNOWN} |"
          echo "| Startup project | ${STARTUP_PROJECT} |"
          echo "| Configuration | ${CONFIGURATION} |"
          echo ""
        } > "$SUMMARY_FILE"

        while read -r MIGRATION_PROJECT; do
          [[ -n "$MIGRATION_PROJECT" ]] || continue

          echo ""
          echo "=========================================="
          echo "Validando migraciones EF Core"
          echo "Migration project: $MIGRATION_PROJECT"
          echo "Startup project:   $STARTUP_PROJECT"
          echo "Configuration:     $CONFIGURATION"
          echo "DbContext:         ${DB_CONTEXT:-auto}"
          echo "=========================================="

          EF_ARGS=()
          EF_ARGS+=(--project "$MIGRATION_PROJECT")
          EF_ARGS+=(--startup-project "$STARTUP_PROJECT")

          if [[ -n "${DB_CONTEXT:-}" ]]; then
            EF_ARGS+=(--context "$DB_CONTEXT")
          fi

          EF_ARGS+=(--configuration "$CONFIGURATION")
          EF_ARGS+=(--no-build)

          set +e
          MIGRATIONS_OUTPUT="$("${EF_CMD[@]}" migrations list "${EF_ARGS[@]}" --connection "$DB_CONNECTION" --verbose 2>&1)"
          MIGRATIONS_EXIT_CODE=$?
          set -e

          echo "$MIGRATIONS_OUTPUT"

          if [[ "$MIGRATIONS_EXIT_CODE" -ne 0 ]]; then
            echo "❌ No se pudo conectar al ORM/base o listar migraciones"
            echo "Migration project: $MIGRATION_PROJECT"
            echo "Startup project: $STARTUP_PROJECT"
            exit "$MIGRATIONS_EXIT_CODE"
          fi

          PENDING_MIGRATIONS="$(echo "$MIGRATIONS_OUTPUT" \
            | sed -nE 's/^[[:space:]]*([0-9]{14}_[A-Za-z0-9_]+)[[:space:]]+\(Pending\).*$/\1/p' \
            | awk '!seen[$0]++')"

          APPLIED_MIGRATIONS="$(
            {
              echo "$MIGRATIONS_OUTPUT" \
                | grep -Ev '\(Pending\)' \
                | sed -nE 's/^[[:space:]]*([0-9]{14}_[A-Za-z0-9_]+).*$/\1/p' \
                | awk '!seen[$0]++'
            } || true
          )"

          if [[ -z "$PENDING_MIGRATIONS" ]]; then
            echo "✅ La base no tiene migraciones pendientes para $MIGRATION_PROJECT"

            {
              echo ""
              echo "## Proyecto: \`$MIGRATION_PROJECT\`"
              echo ""
              echo "- Resultado: sin migraciones pendientes."
              echo "- Riesgo: **NONE**"
            } >> "$SUMMARY_FILE"
          else
            HAS_PENDING=true

            LAST_APPLIED="$(echo "$APPLIED_MIGRATIONS" | tail -n 1)"
            LATEST_PENDING="$(echo "$PENDING_MIGRATIONS" | tail -n 1)"
            FROM_MIGRATION="${LAST_APPLIED:-0}"

            ALL_PENDING_MIGRATIONS="${ALL_PENDING_MIGRATIONS}${PENDING_MIGRATIONS}"$'\n'

            SAFE_PROJECT="$(safe_name "$MIGRATION_PROJECT")"
            SCRIPT_FILE="$ANALYSIS_ROOT/${SAFE_PROJECT}_${ENVIRONMENT_NAME}_pending.sql"
            FINDINGS_FILE="$ANALYSIS_ROOT/${SAFE_PROJECT}_${ENVIRONMENT_NAME}_findings.md"

            echo "⚠️ Migraciones pendientes detectadas:"
            echo "$PENDING_MIGRATIONS"
            echo ""
            echo "Generando SQL idempotente..."
            echo "FROM_MIGRATION=$FROM_MIGRATION"
            echo "LATEST_PENDING=$LATEST_PENDING"
            echo "SCRIPT_FILE=$SCRIPT_FILE"

            "${EF_CMD[@]}" migrations script \
              "$FROM_MIGRATION" \
              "$LATEST_PENDING" \
              "${EF_ARGS[@]}" \
              --idempotent \
              --output "$SCRIPT_FILE"

            echo ""
            echo "Validando archivo SQL generado..."

            if [[ ! -f "$SCRIPT_FILE" ]]; then
              echo "❌ No se generó el archivo SQL esperado: $SCRIPT_FILE"
              echo "Contenido actual de ANALYSIS_ROOT:"
              find "$ANALYSIS_ROOT" -maxdepth 5 -type f -print || true
              exit 1
            fi

            if [[ ! -s "$SCRIPT_FILE" ]]; then
              echo "❌ El archivo SQL se generó pero está vacío: $SCRIPT_FILE"
              exit 1
            fi

            echo "✅ SQL generado correctamente:"
            ls -lh "$SCRIPT_FILE"

            SQL_FILES="${SQL_FILES}${SCRIPT_FILE}"$'\n'

            echo ""
            echo "Contenido actual de ANALYSIS_ROOT:"
            find "$ANALYSIS_ROOT" -maxdepth 5 -type f -print || true

            show_sql_file "$SCRIPT_FILE" "CAT SQL generado para $MIGRATION_PROJECT"

            PROJECT_RISK="$(classify_sql_risk "$SCRIPT_FILE" "$FINDINGS_FILE")"
            OVERALL_RISK="$(max_risk "$OVERALL_RISK" "$PROJECT_RISK")"

            echo "Riesgo calculado para $MIGRATION_PROJECT: $PROJECT_RISK"

            {
              echo ""
              echo "## Proyecto: \`$MIGRATION_PROJECT\`"
              echo ""
              echo "| Campo | Valor |"
              echo "|---|---|"
              echo "| Desde | \`$FROM_MIGRATION\` |"
              echo "| Hasta | \`$LATEST_PENDING\` |"
              echo "| Riesgo | **$PROJECT_RISK** |"
              echo "| SQL generado | \`$(basename "$SCRIPT_FILE")\` |"
              echo ""
              echo "### Migraciones pendientes"
              echo ""
              echo '```text'
              echo "$PENDING_MIGRATIONS"
              echo '```'
              echo ""
              echo "### Hallazgos"
              echo ""
              cat "$FINDINGS_FILE"
              echo ""
            } >> "$SUMMARY_FILE"
          fi

          if [[ "$VALIDATE_MODEL_CHANGES" == "true" ]]; then
            echo ""
            echo "Validando si el modelo tiene cambios sin migración..."

            "${EF_CMD[@]}" migrations has-pending-model-changes "${EF_ARGS[@]}"

            echo "✅ No hay cambios de modelo pendientes de migración para $MIGRATION_PROJECT"
          fi

        done <<< "$MIGRATION_PROJECTS"

        if (( $(risk_value "$OVERALL_RISK") >= 2 )); then
          REQUIRES_DBA=true
        else
          REQUIRES_DBA=false
        fi

        {
          echo ""
          echo "## Resultado final"
          echo ""
          echo "| Campo | Valor |"
          echo "|---|---|"
          echo "| Tiene migraciones pendientes | **$HAS_PENDING** |"
          echo "| Riesgo total | **$OVERALL_RISK** |"
          echo "| Requiere DBA | **$REQUIRES_DBA** |"
        } >> "$SUMMARY_FILE"

        cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"

        {
          echo "has_pending_db_migrations=$HAS_PENDING"
          echo "migration_risk=$OVERALL_RISK"
          echo "requires_dba=$REQUIRES_DBA"
          echo "analysis_dir=$ANALYSIS_ROOT"
          echo "sql_files<<EOF"
          echo "$SQL_FILES"
          echo "EOF"
          echo "pending_migrations<<EOF"
          echo "$ALL_PENDING_MIGRATIONS"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

        echo ""
        echo "=========================================="
        echo "Resultado final"
        echo "Tiene pendientes: $HAS_PENDING"
        echo "Riesgo: $OVERALL_RISK"
        echo "Requiere DBA: $REQUIRES_DBA"
        echo "Análisis generado en: $ANALYSIS_ROOT"
        echo "SQL files:"
        echo "$SQL_FILES"
        echo "=========================================="

        if [[ -n "${FAIL_ON_RISK_LEVEL:-}" ]]; then
          if (( $(risk_value "$OVERALL_RISK") >= $(risk_value "$FAIL_ON_RISK_LEVEL") && $(risk_value "$OVERALL_RISK") > 0 )); then
            echo "❌ Riesgo $OVERALL_RISK >= fail-on-risk-level $FAIL_ON_RISK_LEVEL"
            exit 1
          fi
        fi

        if [[ "$FAIL_ON_PENDING" == "true" && "$HAS_PENDING" == "true" ]]; then
          echo "❌ Existen migraciones pendientes y fail-on-pending=true"
          exit 1
        fi

        echo "✅ Validación de migraciones finalizada"