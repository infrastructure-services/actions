name: 'Generic Build and Push'
description: 'Build y push de imagen de docker'
inputs:
  ACR_USERNAME:
    description: "user de acr"
    required: true
  ACR_PASSWORD:
    description: "password de acr"
    required: true
  ACR_NAME:
    description: "nombre del acr"
    required: true
  ACR_FULL_NAME:
    description: "nombre del acr con azurecr.io"
    required: true
  ACR_USERNAMEWW:
    description: "user de acr"
    required: false
  ACR_PASSWORDWW:
    description: "password de acr"
    required: false
  ACR_NAMEWW:
    description: "nombre del acr"
    required: false
  ACR_FULL_NAMEWW:
    description: "nombre del acr con azurecr.io"
    required: false
  ECR_ID:
    description: "user de acr"
    required: false
  ECR_PASSWORD:
    description: "password de acr"
    required: false

  appName:
    description: "Nombre de la aplicacion (dentro del proyecto)"
    required: true
  teamProject:
    description: "Nombre del proyecto/equipo"
    required: true
  appVersion:
    description: "tag para subir imagen"
    required: true
  matrix_deploy:
    description: "deploy en multiples ambientes"
    required: false
    default: "[]"
 
  andreani:
    description: "Se pushea a la registry de Andreani"
    required: false
    type: boolean
    default: true
  witwot:
    description: "Se pushea a la registry de Witwot"
    required: false
    type: boolean
    default: false
  hop:
    description: "Se pushea a la registry de HOP"
    required: false
    type: boolean
    default: false


runs:
  using: "composite"
  steps:
      - name: Generate Docker Tags
        id: tags
        uses: actions/github-script@v7
        with:
          script: |
            let tags = [];
            let matrix_deploy = ${{ inputs.matrix_deploy }};
            if (matrix_deploy.length > 0) {
              matrix_deploy.forEach(deploy => {
                let tag = `${{ inputs.ACR_FULL_NAME }}/${{inputs.teamProject}}-${{inputs.appName}}-${deploy}:${{ inputs.appVersion}}`
                tags.push(tag);
              });
            } else {
              tags.push(`${{ inputs.ACR_FULL_NAME }}/${{inputs.teamProject}}-${{inputs.appName}}:${{ inputs.appVersion}}`);
            }
            tags.push(`${{ inputs.ACR_FULL_NAME }}/${{inputs.teamProject}}-${{inputs.appName}}:ultima`);
            return tags.join('\n');
          result-encoding: string

      - name: "Debug echos"
        id: version
        shell: bash
        run: |
              echo "Tags Creados"
              echo "${{ steps.tags.outputs.result }}"


      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: setear docker
        uses: docker/setup-buildx-action@v3
        with:
            install: true
            
      - name: Login to Azure Container Registry Andreani
        if: ${{ inputs.andreani }}
        uses: azure/docker-login@v1
        with:
          login-server: ${{ inputs.ACR_FULL_NAME }}
          username: ${{ inputs.ACR_USERNAME }}
          password: ${{ inputs.ACR_PASSWORD }}



      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: . 
          file: Dockerfile 
          push: true
          tags: |
            ${{ steps.tags.outputs.result }}


      - name: AWS Login to ECR
        run: |
          aws configure set aws_access_key_id ${{ secrets.ECR_ID }}
          aws configure set aws_secret_access_key ${{ secrets.ECR_PASSWORD }}
          aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

      - name: Ensure ECR Repository Exists
        env:
          AWS_REGION: us-east-1
        run: |
          REPOSITORY_NAME="${{ vars.PROJECT }}-${{ vars.APPNAME }}"
          aws ecr-public describe-repositories --repository-names "$REPOSITORY_NAME" --region $AWS_REGION || \
          aws ecr-public create-repository --repository-name "$REPOSITORY_NAME" --region $AWS_REGION
          
          # Obtener el URI completo del repositorio público
          REPOSITORY_URI=$(aws ecr-public describe-repositories --repository-names "$REPOSITORY_NAME" --region $AWS_REGION --query 'repositories[0].repositoryUri' --output text)
          echo "REPOSITORY_URI=$REPOSITORY_URI" >> $GITHUB_ENV
          
      
      - name: Push image to ECR
        shell: bash
        run: |
          docker buildx imagetools create \
            --tag ${REPOSITORY_URI}:${{ inputs.appVersion }} \
            ${{ inputs.ACR_FULL_NAME }}/${{ inputs.teamProject }}-${{ inputs.appName }}:ultima