name: "Build and push ecr"

description: "Build y push de una imagen Docker a Amazon ECR"

inputs:
  #########################################################
  # AWS ECR
  #########################################################

  ECR_ID:
    description: "AWS Access Key ID"
    required: true

  ECR_PASSWORD:
    description: "AWS Secret Access Key"
    required: true

  awsRegion:
    description: "Región de AWS"
    required: false
    default: "us-east-1"

  #########################################################
  # APP
  #########################################################

  appName:
    description: "Nombre de la aplicación"
    required: true

  teamProject:
    description: "Nombre del proyecto/equipo"
    required: true

  appVersion:
    description: "Tag de la imagen"
    required: true

runs:
  using: "composite"
  steps:
    #########################################################
    # CHECKOUT
    #########################################################

    - name: Checkout
      uses: actions/checkout@v7

    #########################################################
    # DOCKER BUILDX
    #########################################################

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v4

    #########################################################
    # AWS CREDENTIALS
    #########################################################

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ inputs.ECR_ID }}
        aws-secret-access-key: ${{ inputs.ECR_PASSWORD }}
        aws-region: ${{ inputs.awsRegion }}

    #########################################################
    # LOGIN ECR
    #########################################################

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    #########################################################
    # GENERATE IMAGE INFORMATION
    #########################################################

    - name: Generate Docker image information
      id: image
      shell: bash
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        TEAM_PROJECT: ${{ inputs.teamProject }}
        APP_NAME: ${{ inputs.appName }}
        APP_VERSION: ${{ inputs.appVersion }}
      run: |
        set -euo pipefail

        REPOSITORY_NAME="${TEAM_PROJECT}-${APP_NAME}"
        IMAGE_TAG="${REGISTRY}/${REPOSITORY_NAME}:${APP_VERSION}"

        echo "repository-name=$REPOSITORY_NAME" >> "$GITHUB_OUTPUT"
        echo "image-tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

        echo "Repositorio ECR: $REPOSITORY_NAME"
        echo "Imagen: $IMAGE_TAG"

    #########################################################
    # CREATE ECR REPOSITORY
    #########################################################

    - name: Ensure ECR repository exists
      shell: bash
      env:
        AWS_REGION: ${{ inputs.awsRegion }}
        REPOSITORY_NAME: ${{ steps.image.outputs.repository-name }}
      run: |
        set -euo pipefail

        if aws ecr describe-repositories \
          --repository-names "$REPOSITORY_NAME" \
          --region "$AWS_REGION" \
          >/dev/null 2>&1; then

          echo "El repositorio ya existe: $REPOSITORY_NAME"
        else
          echo "Creando repositorio ECR: $REPOSITORY_NAME"

          aws ecr create-repository \
            --repository-name "$REPOSITORY_NAME" \
            --region "$AWS_REGION" \
            >/dev/null

          echo "Repositorio creado correctamente"
        fi

    #########################################################
    # BUILD + PUSH
    #########################################################

    - name: Build and push
      id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.image.outputs.image-tag }}

    #########################################################
    # FINISH
    #########################################################

    - name: Finish
      shell: bash
      env:
        IMAGE_TAG: ${{ steps.image.outputs.image-tag }}
        IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        echo "Build y push completado correctamente"
        echo "Imagen: $IMAGE_TAG"
        echo "Digest: $IMAGE_DIGEST"