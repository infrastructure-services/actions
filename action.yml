name: Apply DB Migrations
description: Obtiene connection string desde Key Vault, valida SQL Server y aplica migraciones EF Core

inputs:
  migration-risk:
    description: Riesgo de migración recibido desde Continuous Delivery
    required: false
    default: "NONE"
  keyvault-name:
    description: Nombre del Azure Key Vault
    required: true
  client-id:
    description: Azure client id
    required: true
  client-secret:
    description: Azure client secret
    required: true
  tenant-id:
    description: Azure tenant id
    required: true
  secret-name:
    description: Nombre del secret en Key Vault que contiene la connection string
    required: true
  project:
    description: Proyecto de migraciones. Usar auto para detectar automáticamente.
    required: false
    default: "auto"
  startup-project:
    description: Proyecto startup. Ejemplo ./src/Api/LuanaApi.csproj
    required: true
  db-context:
    description: Nombre del DbContext.
    required: false
    default: ""
  configuration:
    description: Configuración de build
    required: false
    default: "Release"
  dotnet-version:
    description: Versión esperada de .NET SDK
    required: false
    default: "10.0.x"
  ef-tool-version:
    description: Versión de dotnet-ef
    required: false
    default: "10.0.5"
  environment-name:
    description: Nombre del ambiente.
    required: false
    default: "UNKNOWN"
  nuget-username:
    description: Usuario de nuget
    required: false
    default: ""
  nuget-token:
    description: Token de nuget
    required: false
    default: ""

outputs:
  skipped:
    description: "Indica si se salteó"
    value: ${{ steps.apply.outputs.skipped }}
  applied:
    description: "Indica si se aplicó"
    value: ${{ steps.apply.outputs.applied }}

runs:
  using: composite
  steps:
    - name: Setup .NET
      if: ${{ inputs.dotnet-version != '' }}
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Apply Migrations
      id: apply
      shell: bash
      env:
        MIGRATION_RISK: ${{ inputs.migration-risk }}
        KEYVAULT_NAME: ${{ inputs.keyvault-name }}
        AZURE_CLIENT_ID: ${{ inputs.client-id }}
        AZURE_CLIENT_SECRET: ${{ inputs.client-secret }}
        AZURE_TENANT_ID: ${{ inputs.tenant-id }}
        SECRET_NAME: ${{ inputs.secret-name }}
        PROJECT: ${{ inputs.project }}
        STARTUP_PROJECT: ${{ inputs.startup-project }}
        DB_CONTEXT: ${{ inputs.db-context }}
        CONFIGURATION: ${{ inputs.configuration }}
        EF_TOOL_VERSION: ${{ inputs.ef-tool-version }}
        ENVIRONMENT_NAME: ${{ inputs.environment-name }}
        NUGET_USERNAME: ${{ inputs.nuget-username }}
        NUGET_TOKEN: ${{ inputs.nuget-token }}
      run: |
        set -euo pipefail

        TOOLS_DIR="${RUNNER_TEMP:-/tmp}/dotnet-ef-tools-apply-${GITHUB_RUN_ID:-local}"
        cleanup() {
          echo "🧹 Limpiando herramientas de apply del runner..."
          rm -rf "$TOOLS_DIR"
        }
        trap cleanup EXIT SIGINT SIGTERM

        echo "Conectando a Azure Key Vault y descargando connection string..."
        AZURE_LOGIN_OUTPUT="$(az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID" 2>&1)"
        DB_CONNECTION="$(az keyvault secret show --name "$SECRET_NAME" --vault-name "$KEYVAULT_NAME" --query value -o tsv 2>&1)"
        echo "::add-mask::$DB_CONNECTION"

        detect_projects() {
          if [[ "${PROJECT}" != "auto" ]]; then
            echo "$PROJECT" | tr ',' '\n'
            return
          fi
          # Bugfix: Forzar descubrimiento local seguro
          find . -path "*/Migrations/*.cs" -not -path "*/bin/*" -not -path "*/obj/*" -not -name "*.Designer.cs" -not -name "*ModelSnapshot.cs" -print | while read -r f; do
            local d="$(dirname "$f")"
            while [[ "$d" != "." && "$d" != "/" ]]; do
              local p="$(find "$d" -maxdepth 1 -name "*.csproj" -print | head -n 1 || true)"
              if [[ -n "$p" ]]; then echo "$p"; break; fi
              d="$(dirname "$d")"
            done
          done | sort -u
        }

        MIGRATION_PROJECTS="$(detect_projects || true)"
        if [[ -z "$MIGRATION_PROJECTS" ]]; then
          echo "skipped=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        BUILD_TARGET="./"
        SLN_FILE="$(find . -maxdepth 2 -name "*.sln" -print | head -n 1 || true)"
        if [[ -n "$SLN_FILE" ]]; then BUILD_TARGET="$SLN_FILE"; else BUILD_TARGET="$STARTUP_PROJECT"; fi

        dotnet restore "$BUILD_TARGET"
        dotnet build "$BUILD_TARGET" --no-restore --configuration "$CONFIGURATION"

        rm -rf "$TOOLS_DIR" && mkdir -p "$TOOLS_DIR"
        dotnet tool install dotnet-ef --tool-path "$TOOLS_DIR" --version "$EF_TOOL_VERSION"
        EF_CMD=("$TOOLS_DIR/dotnet-ef")

        while read -r PROJ; do
          [[ -n "$PROJ" ]] || continue
          EF_ARGS=(--project "$PROJ" --startup-project "$STARTUP_PROJECT" --configuration "$CONFIGURATION" --no-build)
          if [[ -n "${DB_CONTEXT}" ]]; then EF_ARGS+=(--context "$DB_CONTEXT"); fi
          
          echo "Ejecutando actualización de base para: $PROJ"
          "${EF_CMD[@]}" database update "${EF_ARGS[@]}" --connection "$DB_CONNECTION"
        done < <(echo "$MIGRATION_PROJECTS")

        echo "skipped=false" >> "$GITHUB_OUTPUT"
        echo "applied=true" >> "$GITHUB_OUTPUT"