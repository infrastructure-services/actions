name: Database Release Qualification V1 (Analyze Only)
description: Normaliza, analiza y empaqueta una Database Release sin ejecutar SQL ni deployment

inputs:
  release-id:
    description: Identificador inmutable de la release.
    required: true
  attestation-id:
    description: Identificador único e inmutable de esta qualification/run.
    required: true
  environment-name:
    description: Ambiente de qualification. Esta action V1 admite únicamente TEST.
    required: false
    default: TEST
  source-kind:
    description: Origen normalizado de la release (EF o SQL).
    required: true
  scenario:
    description: Escenario inferido por discovery (NEW_EF, EXISTING_EF o EXISTING_SQL).
    required: true
  database-lifecycle:
    description: Lifecycle declarado (NEW o EXISTING).
    required: true
  discovery-status:
    description: Estado de consistencia producido por discovery.
    required: true
  discovery-reason:
    description: Razón estable producida por discovery.
    required: true
  forward-sql:
    description: Path del forward.sql ya materializado por su fuente.
    required: true
  rollback-sql:
    description: Path del rollback.sql provisto/materializado por el autor.
    required: true
  schema-snapshot:
    description: Path de un SchemaSnapshot JSON obtenido mediante inspección read-only.
    required: true
  output-directory:
    description: Directorio raíz del package db-release.
    required: false
    default: artifacts/db-release
  dotnet-version:
    description: Versión del SDK usada por el engine.
    required: false
    default: 10.0.x

outputs:
  qualification-status:
    description: ANALYZED_NOT_REHEARSED, BLOCKED_DISCOVERY o BLOCKED_ANALYSIS_CONFIDENCE.
    value: ${{ steps.qualify.outputs.qualification_status }}
  final-risk:
    description: Peor dimensión calculada (LOW, MEDIUM o HIGH).
    value: ${{ steps.qualify.outputs.final_risk }}
  requires-dba-approval:
    description: Decisión modelada; no modifica approvals legacy.
    value: ${{ steps.qualify.outputs.requires_dba_approval }}
  package-directory:
    description: Directorio raíz local de la release.
    value: ${{ steps.qualify.outputs.package_directory }}
  payload-directory:
    description: Directorio del payload independiente del ambiente.
    value: ${{ steps.qualify.outputs.payload_directory }}
  attestation-directory:
    description: Directorio de la qualification específica del ambiente/run.
    value: ${{ steps.qualify.outputs.attestation_directory }}
  payload-hash:
    description: Identidad SHA256 del payload estable.
    value: ${{ steps.qualify.outputs.payload_hash }}

runs:
  using: composite
  steps:
    - name: Setup .NET for qualification engine
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Analyze and package database release (no SQL execution)
      id: qualify
      shell: bash
      env:
        RELEASE_ID: ${{ inputs.release-id }}
        ATTESTATION_ID: ${{ inputs.attestation-id }}
        ENVIRONMENT_NAME: ${{ inputs.environment-name }}
        SOURCE_KIND: ${{ inputs.source-kind }}
        SCENARIO: ${{ inputs.scenario }}
        DATABASE_LIFECYCLE: ${{ inputs.database-lifecycle }}
        DISCOVERY_STATUS: ${{ inputs.discovery-status }}
        DISCOVERY_REASON: ${{ inputs.discovery-reason }}
        FORWARD_SQL: ${{ inputs.forward-sql }}
        ROLLBACK_SQL: ${{ inputs.rollback-sql }}
        SCHEMA_SNAPSHOT: ${{ inputs.schema-snapshot }}
        OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
        RESULT_FILE: ${{ runner.temp }}/database-release-qualification-result.json
      run: bash "$GITHUB_ACTION_PATH/scripts/run-database-release-qualification.sh"
